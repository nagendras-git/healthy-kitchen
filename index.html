<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0d0d10;--sf:#141417;--sf2:#1e1e25;--sf3:#26262f;
  --bd:#4a4a60;--bd2:#383850;--scrim:rgba(0,0,0,.72);
  --t1:#f4f4fa;--t2:#c8c8e0;--t3:#8888a0;
  --green:#22c55e;--gbg:rgba(34,197,94,.1);--gbd:rgba(34,197,94,.22);
  --red:#f87171;--rbg:rgba(248,113,113,.1);--rbd:rgba(248,113,113,.22);
  --amber:#fbbf24;--abg:rgba(251,191,36,.1);--abd:rgba(251,191,36,.22);
  --blue:#3b82f6;--blue-bg:rgba(59,130,246,.1);--blue-bd:rgba(59,130,246,.22);
  --purple:#8b5cf6;--pbg:rgba(139,92,246,.1);--pbd:rgba(139,92,246,.22);
  --nav-h:60px;--sb:env(safe-area-inset-bottom,0px);
  --sat:env(safe-area-inset-top,0px);
  --hdr-h:calc(var(--sat) + 62px);
  --r:12px;--rl:16px;--rx:20px;
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
[data-theme="soft-dark"]{--bg:#1a1a1f;--sf:#222228;--sf2:#2a2a32;--sf3:#313139;--bd:#4c4c5c;--bd2:#3d3d4a;--t1:#ececf1;--t2:#b8b8c8;--t3:#888898;}
[data-theme="soft-dark"] .hdr{background:rgba(26,26,31,.98)!important}
[data-theme="soft-dark"] .tbar{background:rgba(26,26,31,.98)!important}
[data-theme="light"]{--bg:#f2f2f7;--sf:#fff;--sf2:#fff;--sf3:#f0f0f5;--bd:#c8c8d8;--bd2:#d8d8e4;--t1:#1a1a25;--t2:#606078;--t3:#9898b0;--scrim:rgba(0,0,0,.45);}
[data-theme="light"] .hdr{background:var(--bg)!important;border-bottom:1px solid var(--bd)!important}
[data-theme="light"] .tbar{background:var(--bg)!important;border-top:1px solid var(--bd)!important}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;font-size:16px;background:var(--bg)}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;padding-bottom:calc(var(--nav-h) + var(--sb) + 4px);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
::-webkit-scrollbar{width:0;height:0}
.lbl{font-size:.62rem;font-weight:700;color:var(--t3);letter-spacing:.4px;text-transform:uppercase}
.pg{display:none}.pg.active{display:block;animation:pgIn .22s var(--ease) both;padding-top:var(--hdr-h)}
@keyframes pgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.wrap{width:100%;max-width:480px;margin:0 auto;padding:12px 14px 0}

/* ── Header ── */
.hdr{position:fixed;top:0;left:0;right:0;z-index:80;background:rgba(13,13,16,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bd2);padding-top:calc(var(--sat) + 14px);padding-bottom:13px;padding-left:16px;padding-right:16px;display:flex;align-items:center;justify-content:center;}
.hdr-in{width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;}
.hdr-l{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.hdr-gr{font-size:.72rem;color:var(--t3);font-weight:400;line-height:1}
.hdr-nm{font-size:1.1rem;font-weight:800;color:var(--t1);letter-spacing:-.4px;line-height:1.2}
.hdr-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hdr-icon-btn{width:32px;height:32px;border-radius:50%;background:var(--sf2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 120ms;}
.hdr-icon-btn:active{transform:scale(.9);background:var(--sf3)}

/* ── Tab bar ── */
.tbar{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(13,13,16,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--bd);height:calc(var(--nav-h) + var(--sb));padding-bottom:var(--sb);display:flex;align-items:flex-start;justify-content:center;padding-top:7px;}
.tbar-in{width:100%;max-width:480px;display:flex;align-items:flex-start;justify-content:space-around;}
.titem{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:0;background:none;border:none;color:var(--t3);transition:color 120ms;}
.titem.active{color:var(--green)}
.tico{height:26px;display:flex;align-items:center;justify-content:center;}
.tico svg{width:1.35rem;height:1.35rem;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.35;transition:opacity 200ms}
.titem.active .tico svg{opacity:1;stroke:var(--green)}
.tlabel{font-size:.62rem;font-weight:700;letter-spacing:.2px}

/* ── Sheet ── */
.sov{position:fixed;inset:0;z-index:500;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .22s;}
.sov.open{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:501;max-width:480px;margin:0 auto;background:var(--sf);border-radius:20px 20px 0 0;border:1px solid var(--bd);border-bottom:none;max-height:min(88dvh,90vh);overflow-y:auto;overscroll-behavior:contain;transform:translateY(110%);transition:transform .3s var(--ease);padding-bottom:calc(16px + var(--sb));visibility:hidden;}
.sheet.open{transform:translateY(0);visibility:visible}
.shdl{width:36px;height:4px;background:var(--bd);border-radius:99px;margin:10px auto 0;}
.shhdr{position:sticky;top:0;z-index:2;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;background:var(--sf);border-bottom:1px solid var(--bd2);}
.shtitle{font-size:.9rem;font-weight:800;color:var(--t1);}
.shclose{width:28px;height:28px;border-radius:50%;background:var(--sf2);border:1px solid var(--bd);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.88rem;color:var(--t2);}
.shbody{padding:14px 16px;}

/* ── Toast ── */
.toast{position:fixed;bottom:calc(var(--nav-h) + var(--sb) + 16px);left:50%;transform:translateX(-50%) translateY(8px);background:var(--sf);border:1px solid var(--bd);color:var(--t1);padding:9px 20px;border-radius:99px;font-size:.88rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s var(--spring);white-space:nowrap;z-index:1000;box-shadow:0 4px 24px rgba(0,0,0,.55);max-width:calc(100vw - 40px);text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Forms ── */
.fg{margin-bottom:13px}
.fl{font-size:.68rem;font-weight:700;color:var(--t3);margin-bottom:5px;display:block;letter-spacing:.3px}
.fi{width:100%;font-size:1rem!important;padding:10px 12px;border:1px solid var(--bd);border-radius:var(--r);font-family:'Inter',sans-serif;font-weight:500;background:var(--sf2);color:var(--t1);outline:none;-webkit-appearance:none;transition:border-color 150ms,box-shadow 150ms;}
.fi:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.12);background:var(--sf)}
.fi::placeholder{color:var(--t3)}
textarea.fi{resize:vertical;min-height:68px;line-height:1.5;}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:10px 18px;border-radius:var(--r);font-family:'Inter',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;border:none;transition:all 150ms var(--spring);}
.btn:active{transform:scale(.96)}
.btn-p{background:var(--green);color:#fff;}
.btn-g{background:var(--sf2);color:var(--t2);border:1px solid var(--bd);}
.btn-d{color:var(--red);background:var(--rbg);border:1px solid var(--rbd);}
.factions{display:flex;gap:9px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--bd2)}

/* ── Row list ── */
.rlist{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rx);overflow:hidden;}
.ritem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--bd2);cursor:pointer;transition:background 120ms;}
.ritem:last-child{border-bottom:none}
.ritem:active{background:var(--sf2)}
.rava{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.88rem;font-weight:700;}
.rbody{flex:1;min-width:0}
.rtitle{font-size:.88rem;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:.72rem;color:var(--t3);margin-top:2px}
.rright{text-align:right;flex-shrink:0;display:flex;align-items:center;gap:6px;}
.rtag{font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:99px;}
.rchev{color:var(--t3);opacity:.5;display:flex;align-items:center;flex-shrink:0;}
.rchev svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;}
.rib{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1.5px solid var(--bd);background:var(--sf2);transition:all 120ms;flex-shrink:0;}
.rib:active{transform:scale(.9)}
.rib svg{width:14px;height:14px;stroke:var(--t2);fill:none;stroke-width:2;stroke-linecap:round;}
.rib.add{background:var(--gbg);border-color:var(--gbd);color:var(--green);font-family:'Inter',sans-serif;font-size:.72rem;font-weight:700;width:auto;padding:0 10px;}
.rib.del{background:var(--rbg);border-color:var(--rbd);}
.rib.del svg{stroke:var(--red)}

/* ── Collapsible sections ── */
.shdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rl);margin-bottom:5px;transition:background 120ms;}
.shdr:active{background:var(--sf3)}
.shdr-l{display:flex;align-items:center;gap:9px;min-width:0;flex:1;}
.sec-ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stitle{font-size:.86rem;font-weight:700;color:var(--t1);}
.shdr-r{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.sec-cnt{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:99px;}
.scaret{color:var(--t3);transition:transform .25s var(--ease);display:flex;align-items:center;}
.scaret svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;}
.scaret.open{transform:rotate(180deg)}
.sbody{overflow:hidden;max-height:0;opacity:0;pointer-events:none;transition:max-height .38s var(--ease),opacity .22s ease;}
.sbody.open{max-height:9999px;opacity:1;pointer-events:auto;}
.addrow{display:flex;align-items:center;justify-content:center;padding:12px;border:1px solid var(--gbd);border-radius:var(--rl);cursor:pointer;color:var(--green);font-size:.84rem;font-weight:600;gap:8px;background:var(--gbg);transition:all 120ms;}
.addrow:active{opacity:.7}

/* ── Profile/Settings cards ── */
.pcard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);overflow:hidden;}
.prow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--bd2);}
.prow:last-child{border-bottom:none}
.pico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pinfo{flex:1;min-width:0}.ptitle{font-size:.88rem;font-weight:600;color:var(--t1)}.psub{font-size:.72rem;color:var(--t3);margin-top:2px}
.ptap{cursor:pointer;transition:background 120ms;}.ptap:active{background:var(--sf2)}
.plbl{font-size:.62rem;font-weight:700;color:var(--t3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:7px;}
.pshdr{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;user-select:none;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rl);margin-bottom:6px;transition:background 120ms;}
.pshdr:active{background:var(--sf3)}
.pshdr-l{display:flex;align-items:center;gap:8px;}
.pshdr-title{font-size:.86rem;font-weight:600;color:var(--t1);}

/* ── Toggle ── */
.tog{width:38px;height:20px;border-radius:99px;background:var(--sf3);border:1px solid var(--bd);cursor:pointer;position:relative;transition:background 200ms;flex-shrink:0;}
.tog.on{background:var(--green);border-color:var(--green)}
.togth{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:all 200ms var(--spring)}
.tog.on .togth{left:20px}

/* ── Font size buttons ── */
.fsbtn{padding:7px 10px;border-radius:var(--r);border:1px solid var(--bd);background:var(--sf2);color:var(--t2);font-family:'Inter',sans-serif;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .12s;}
.fsbtn.on{background:var(--green);color:#fff;border-color:var(--green)}
.fsbtn:active{transform:scale(.93)}

/* ── Calendar ── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-nav-btn{width:32px;height:32px;border-radius:50%;background:var(--sf2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 120ms;}
.cal-nav-btn:active{background:var(--sf3);transform:scale(.88)}
.cal-nav-btn svg{width:14px;height:14px;stroke:var(--t1);fill:none;stroke-width:2.5;stroke-linecap:round;}
.cal-month-lbl{font-size:1rem;font-weight:800;letter-spacing:-.3px}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:4px;}
.cal-dow{font-size:.6rem;font-weight:700;color:var(--t3);padding:4px 0;letter-spacing:.04em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-day{height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:9px;cursor:pointer;font-size:.84rem;font-weight:500;transition:all .12s;position:relative;padding-bottom:5px;}
.cal-day:active{transform:scale(.88)}
.cal-day.empty{cursor:default}
.cal-day.today{background:var(--blue-bg);color:var(--blue);font-weight:800;border:1px solid var(--blue-bd)}
.cal-day.selected{background:var(--green);color:#fff;font-weight:800;border:1px solid var(--gbd)}
.cal-day.has-plan::after{content:'';position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--green);}

/* ── Home — today meals ── */
.hero-card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rx);overflow:hidden;margin-bottom:10px;}
.hero-top{padding:14px 16px 12px;border-bottom:1px solid var(--bd2);}
.hero-eyebrow{font-size:.62rem;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;}
.hero-title{font-size:1.15rem;font-weight:800;letter-spacing:-.3px;color:var(--t1);}
.meal-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--bd2);cursor:pointer;transition:background 120ms;}
.meal-row:last-child{border-bottom:none}
.meal-row:active{background:var(--sf2)}
.meal-ico{font-size:1.1rem;width:24px;text-align:center;flex-shrink:0;}
.meal-body{flex:1;min-width:0}
.meal-type-lbl{font-size:.6rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;}
.meal-name{font-size:.88rem;font-weight:700;color:var(--t1);}
.meal-sub{font-size:.68rem;color:var(--t3);margin-top:1px;display:flex;align-items:center;gap:5px;}
.meal-fav{display:inline-flex;align-items:center;gap:3px;font-size:.64rem;font-weight:700;padding:1px 6px;border-radius:99px;}
.meal-kcal{font-size:.72rem;font-weight:700;color:var(--t3);flex-shrink:0;font-variant-numeric:tabular-nums;}
.meal-empty-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--bd2);cursor:pointer;opacity:.55;transition:opacity 120ms;}
.meal-empty-row:last-child{border-bottom:none}
.meal-empty-row:active{opacity:.35}

/* week-strip removed */

/* ── Nutrition chips ── */
.nut-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;}
.nut-chip{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:10px 6px;text-align:center;}
.nut-v{font-size:.95rem;font-weight:800;color:var(--t1);line-height:1;}
.nut-l{font-size:.56rem;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-top:3px;}

/* ── Recipe tag chips ── */
.tag-chips{display:flex;gap:4px;flex-wrap:wrap;margin:5px 0 2px;}
.tc{font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:99px;}
.tc-g{background:var(--gbg);color:var(--green);border:1px solid var(--gbd);}
.tc-b{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bd);}
.tc-a{background:var(--abg);color:var(--amber);border:1px solid var(--abd);}
.tc-r{background:var(--rbg);color:var(--red);border:1px solid var(--rbd);}
.tc-p{background:var(--pbg);color:var(--purple);border:1px solid var(--pbd);}

/* ── Plan calendar day sheet ── */
.plan-day-title{font-size:1rem;font-weight:800;color:var(--t1);margin-bottom:3px;}
.plan-day-sub{font-size:.72rem;color:var(--t3);margin-bottom:14px;}
.plan-slot{padding:11px 0;border-bottom:1px solid var(--bd2);}
.plan-slot:last-child{border-bottom:none}
.plan-slot-lbl{font-size:.62rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;display:flex;align-items:center;gap:4px;}
.plan-filled{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);}
.plan-filled-name{flex:1;font-size:.88rem;font-weight:700;color:var(--t1);}
.plan-filled-sub{font-size:.66rem;color:var(--t3);margin-top:1px;}
.plan-empty{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--sf2);border:1px dashed var(--bd);border-radius:var(--r);cursor:pointer;opacity:.65;}
.plan-empty span{font-size:.84rem;color:var(--t3);}

/* ── Member avatar ── */
.mav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.92rem;font-weight:800;flex-shrink:0;}

/* ── Search bar ── */
.search-bar{display:flex;align-items:center;gap:9px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:9px 13px;}
.search-bar svg{width:15px;height:15px;stroke:var(--t3);fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0;}
.search-bar input{flex:1;background:none;border:none;outline:none;color:var(--t1);font-family:'Inter',sans-serif;font-size:.9rem;font-weight:500;}
.search-bar input::placeholder{color:var(--t3)}

/* ── FAB ── */

// ─── DATA ────────────────────────────────────────────────────────────────
let D={recipes:[],plan:{},members:[],settings:{theme:'dark',fontSize:16,servings:3}};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function save(){localStorage.setItem('hkv4',JSON.stringify({...D,_v:4}));}
function load(){try{const r=JSON.parse(localStorage.getItem('hkv4'));if(r&&r._v===4)D={...D,...r};}catch(e){}}
load();
if(!D.recipes||!D.recipes.length)D.recipes=SEED_RECIPES.map(r=>({...r}));
if(!D.members||!D.members.length)D.members=DEFAULT_MEMBERS.map(m=>({...m}));
(function(){
  const today=new Date(),dow=today.getDay();
  for(let i=0;i<7;i++){
    const d=new Date(today);d.setDate(today.getDate()-dow+i);
    const k=dk(d);if(!D.plan[k])D.plan[k]={};
    const t=WEEKLY_TPL[i];
    Object.keys(t).forEach(mt=>{if(!D.plan[k][mt])D.plan[k][mt]={recipeId:t[mt]};});
  }
})();
save();

// ─── DATE HELPERS ────────────────────────────────────────────────────────
function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayKey(){return dk(new Date());}
function weekDates(){
  const t=new Date(),dow=t.getDay();
  return Array.from({length:7},(_,i)=>{const d=new Date(t);d.setDate(t.getDate()-dow+i);return d;});
}

// ─── THEME / FONT ────────────────────────────────────────────────────────
function applyTheme(t){document.documentElement.setAttribute('data-theme',t==='dark'?'':t==='soft-dark'?'soft-dark':'light');D.settings.theme=t;save();}
function applyFontSize(n){document.documentElement.style.fontSize=n+'px';D.settings.fontSize=n;save();document.querySelectorAll('.fsbtn').forEach(b=>{b.classList.toggle('on',+b.dataset.sz===n);});}
function initAppearance(){
  const t=D.settings.theme||'dark';
  if(t!=='dark')document.documentElement.setAttribute('data-theme',t);
  document.documentElement.style.fontSize=(D.settings.fontSize||16)+'px';
}
initAppearance();

  const b=document.getElementById('b-'+id);
  const c=document.getElementById('c-'+id);
  if(!b||!c)return;
  const open=b.classList.toggle('open');
  c.classList.toggle('open',open);
}

// ─── TAB ────────────────────────────────────────────────────────────────
let curTab='home';
function switchTab(tab){
  curTab=tab;
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.titem').forEach(n=>n.classList.remove('active'));
  document.getElementById('pg-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('fab').classList.toggle('hide',tab!=='recipes');
  if(tab==='home')renderHome();
  if(tab==='recipes')renderRecipes();
  if(tab==='plan')renderPlan();
  if(tab==='settings')renderSettings();
}

// ─── RECIPES ────────────────────────────────────────────────────────────

// Food emoji per recipe — makes cards feel like real dishes
const RECIPE_EMOJI={
  b1:'🥞',b2:'🍚',b3:'🌶️',b4:'🫓',b5:'☕',b6:'🍳',b7:'🫓',
  l1:'🌿',l2:'🍅',l3:'🥦',l4:'🫛',l5:'🥚',l6:'🥬',l7:'🥔',
  d1:'🥚',d2:'🫓',d3:'🌿',d4:'🫛',d5:'🥔',d6:'🫓',d7:'💫',
  s1:'🌶️',s2:'🫛',s3:'🍌',s4:'🥨',s5:'🌱',s6:'🥛',s7:'🟤',
};
let activeMealTab='All';
const expandedSections=new Set(); // persists which sections are open

function renderRecipes(){
  const q=(document.getElementById('recipe-search')||{}).value||'';
  const query=q.trim().toLowerCase();
  document.getElementById('recipe-count-lbl').textContent=D.recipes.length+' recipes';

  // Meal type tabs
  const tabs=['All',...MEAL_TYPES];
  document.getElementById('meal-tabs').innerHTML=tabs.map(t=>`
    <div class="mchip${t===activeMealTab?' sel':''}" onclick="setMealTab('${t}')">${t==='All'?'All':MEAL_ICONS[t]+' '+t}</div>
  `).join('');

  // Filter
  let filtered=D.recipes.filter(r=>{
    const matchTab=activeMealTab==='All'||(r.meal||[]).includes(activeMealTab);
    const matchQ=!query||r.name.toLowerCase().includes(query)||(r.tags||[]).some(t=>t.toLowerCase().includes(query));
    return matchTab&&matchQ;
  });

  if(!filtered.length){
    document.getElementById('recipe-sections').innerHTML='<div class="empty"><div class="empty-icon">🌿</div><div class="empty-text">No recipes found.<br>Try a different search.</div></div>';
    return;
  }

  // Collapsible sections by meal type — state persists in expandedSections
  const groupKeys=activeMealTab==='All'?MEAL_TYPES:[activeMealTab];
  // When a single tab is selected, auto-open it
  if(activeMealTab!=='All')expandedSections.add('sec-'+activeMealTab);
  let html='';
  groupKeys.forEach(mt=>{
    const group=filtered.filter(r=>(r.meal||[]).includes(mt));
    if(!group.length)return;
    const secId='sec-'+mt;
    const isOpen=expandedSections.has(secId);
    const totalKcal=group.reduce((s,r)=>s+(r.kcal||0),0);
    html+=`<div class="shdr" onclick="toggleRecSec('${secId}')">
      <div class="shdr-l">
        <div class="sec-ico" style="background:var(--gbg);border:1px solid var(--gbd);font-size:.92rem">${MEAL_ICONS[mt]||'🍽️'}</div>
        <div>
          <div class="stitle">${mt}</div>
          <div style="font-size:.62rem;color:var(--t3);margin-top:1px">${group.length} recipes · avg ${Math.round(totalKcal/group.length)} kcal</div>
        </div>
      </div>
      <div class="shdr-r">
        <span class="sec-cnt" style="background:var(--gbg);color:var(--green);border:1px solid var(--gbd)">${group.length}</span>
        <span class="scaret${isOpen?' open':''}" id="c-${secId}"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></span>
      </div>
    </div>
    <div class="sbody${isOpen?' open':''}" id="b-${secId}" style="margin-bottom:6px">
      <div class="rlist" style="margin-bottom:8px">
        ${group.map(r=>recipeRowHtml(r)).join('')}
      </div>
    </div>`;
  });
  document.getElementById('recipe-sections').innerHTML=html||'<div class="empty"><div class="empty-icon">🌿</div><div class="empty-text">Nothing here yet.</div></div>';
}

function toggleRecSec(id){
  if(expandedSections.has(id))expandedSections.delete(id);
  else expandedSections.add(id);
  // re-render just the caret and body without full re-render
  const b=document.getElementById('b-'+id);
  const c=document.getElementById('c-'+id);
  if(b&&c){
    const open=expandedSections.has(id);
    b.classList.toggle('open',open);
    c.classList.toggle('open',open);
  }
}

function setMealTab(t){activeMealTab=t;renderRecipes();}

function recipeRowHtml(r){
  const favMs=D.members.filter(m=>(r.favOf||[]).includes(m.id));
  const tagHtml=(r.tags||[]).slice(0,2).map(t=>`<span class="tc ${TAG_CLS[t]||'tc-a'}">${t}</span>`).join('');
  const foodEmoji=RECIPE_EMOJI[r.id]||'🍽️';
  // Show fav member names prominently if any
  const favLine=favMs.length
    ? `<span style="font-size:.68rem;color:var(--amber);font-weight:600">❤️ ${favMs.map(m=>m.name).join(', ')}</span>`
    : '';
  return `<div class="ritem" onclick="openRecipeSheet('${r.id}')">
    <div class="rava" style="background:var(--gbg);border:1px solid var(--gbd);font-size:1.45rem;width:42px;height:42px;border-radius:12px">${foodEmoji}</div>
    <div class="rbody">
      <div class="rtitle">${esc(r.name)}</div>
      ${r.tel?`<div style="font-size:.65rem;color:var(--t3);margin-top:1px">${esc(r.tel)}</div>`:''}
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:3px">${tagHtml}</div>
      ${favLine?`<div style="margin-top:3px">${favLine}</div>`:''}
    </div>
    <div class="rright" style="flex-direction:column;align-items:flex-end;gap:4px">
      ${r.kcal?`<span style="font-size:.7rem;font-weight:700;color:var(--t3)">${r.kcal} kcal</span>`:''}
      ${r.time?`<span style="font-size:.64rem;color:var(--t3)">⏱ ${r.time}m</span>`:''}
      <div class="rchev"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>
  </div>`;
}

function openRecipeSheet(id){
  const r=D.recipes.find(x=>x.id===id);if(!r)return;
  const favMs=D.members.filter(m=>(r.favOf||[]).includes(m.id));
  const tagHtml=(r.tags||[]).map(t=>`<span class="tc ${TAG_CLS[t]||'tc-a'}">${t}</span>`).join('');
  const favHtml=favMs.length?`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px">${favMs.map(m=>`<span style="display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;background:${m.color}18;color:${m.color};border:1px solid ${m.color}30">${m.emoji} ${esc(m.name)}'s fave</span>`).join('')}</div>`:'';
  const ingrHtml=(r.ingredients||[]).map(i=>`<span style="display:inline-flex;font-size:.72rem;background:var(--sf2);border:1px solid var(--bd);border-radius:99px;padding:3px 9px;color:var(--t2)">${esc(i)}</span>`).join('');
  const stepsHtml=(r.steps||[]).map((s,i)=>`<div style="display:flex;gap:9px;align-items:flex-start;margin-bottom:8px"><div style="width:20px;height:20px;border-radius:50%;background:var(--gbg);border:1px solid var(--gbd);color:var(--green);font-size:.62rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px">${i+1}</div><div style="font-size:.82rem;color:var(--t2);line-height:1.55">${esc(s)}</div></div>`).join('');
  openSheet(r.name,`
    ${r.tel?`<div style="font-size:.78rem;color:var(--t3);font-weight:500;margin-bottom:8px">${esc(r.tel)}</div>`:''}
    <div class="tag-chips" style="margin-bottom:8px">${tagHtml}</div>
    <div style="display:flex;gap:10px;font-size:.72rem;color:var(--t3);margin-bottom:10px">
      ${r.kcal?`<span>⚡ ${r.kcal} kcal</span>`:''}
      ${r.time?`<span>⏱ ${r.time} min</span>`:''}
      ${(r.meal||[]).length?`<span>🍽️ ${r.meal.join(', ')}</span>`:''}
    </div>
    ${favHtml}
    <p style="font-size:.82rem;color:var(--t2);line-height:1.6;margin-bottom:14px">${esc(r.desc||'')}</p>
    <div class="lbl" style="margin-bottom:8px">INGREDIENTS</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px">${ingrHtml}</div>
    <div class="lbl" style="margin-bottom:8px">METHOD</div>
    <div style="margin-bottom:16px">${stepsHtml}</div>
    <div style="display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--bd2)">
      <button class="btn btn-p" style="flex:1" onclick="closeSheet();openPlanSheetForRecipe('${r.id}')">+ Add to Plan</button>
      <button class="btn btn-g" onclick="closeSheet();openAddRecipeSheet('${r.id}')">Edit</button>
      <button class="btn btn-d" onclick="closeSheet();delRecipe('${r.id}')">Delete</button>
    </div>`);
}

function openRecipeDetail(id){
  switchTab('recipes');
  setTimeout(()=>{
    // expand the section that contains this recipe
    D.recipes.filter(r=>r.id===id).forEach(r=>{
      (r.meal||[]).forEach(mt=>{expandedSections.add('sec-'+mt);});
    });
    renderRecipes();
    setTimeout(()=>openRecipeSheet(id),80);
  },60);
}

function delRecipe(id){
  if(!confirm('Delete this recipe?'))return;
  D.recipes=D.recipes.filter(r=>r.id!==id);
  Object.keys(D.plan).forEach(dk2=>Object.keys(D.plan[dk2]).forEach(mt=>{
    if(D.plan[dk2][mt]&&D.plan[dk2][mt].recipeId===id)delete D.plan[dk2][mt];
  }));
  save();renderRecipes();toast('Recipe deleted');
}

    </div>

    <textarea class="fi" id="rs-ingr" style="min-height:88px">${r?(r.ingredients||[]).join('\n'):''}</textarea></div>
    <div class="fg"><label class="fl">Steps (one per line)</label>
    <textarea class="fi" id="rs-steps" style="min-height:88px">${r?(r.steps||[]).join('\n'):''}</textarea></div>

function saveRecipe(editId){
  const name=document.getElementById('rs-name').value.trim();
  if(!name){toast('Name required');return;}
  const meal=[...document.querySelectorAll('#rs-meal .mchip.sel')].map(e=>e.textContent.trim());
  const tags=[...document.querySelectorAll('#rs-tags .mchip.sel')].map(e=>e.textContent.trim());
  const favOf=[...document.querySelectorAll('#rs-fav .mchip.sel')].map(e=>e.dataset.val);
  const ingr=document.getElementById('rs-ingr').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const steps=document.getElementById('rs-steps').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const r={id:editId||uid(),name,desc:document.getElementById('rs-desc').value.trim(),meal,tags,favOf,
    kcal:parseInt(document.getElementById('rs-kcal').value)||0,
    time:parseInt(document.getElementById('rs-time').value)||0,ingredients:ingr,steps};
  if(editId){const i=D.recipes.findIndex(x=>x.id===editId);if(i>=0)D.recipes[i]=r;}
  else D.recipes.unshift(r);
  save();closeSheet();renderRecipes();toast(editId?'Updated ✓':'Recipe added ✓');
}

// ─── PLAN (CALENDAR) ─────────────────────────────────────────────────────
let calYear=new Date().getFullYear();
let calMonth=new Date().getMonth();
let calSelKey=todayKey();

function renderPlan(){
  renderCalHeader();
  renderCalGrid();
  renderPlanDayDetail(calSelKey);
}

function renderCalHeader(){
  const lbl=new Date(calYear,calMonth,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
  document.getElementById('cal-month-lbl').textContent=lbl;
  document.getElementById('cal-hdr-lbl').textContent=lbl;
}

function renderCalGrid(){
  const DOWS=['S','M','T','W','T','F','S'];
  document.getElementById('cal-dows').innerHTML=DOWS.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const tk=todayKey();
  let html='';
  for(let i=0;i<firstDay;i++)html+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const date=new Date(calYear,calMonth,d);
    const k=dk(date);
    const isToday=k===tk;
    const isSel=k===calSelKey;
    const hasPlan=Object.keys(D.plan[k]||{}).length>0;
    html+=`<div class="cal-day${isToday?' today':''}${isSel?' selected':''}${hasPlan?' has-plan':''}" onclick="selectCalDay('${k}')">${d}</div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
}

function changeMonth(dir){
  calMonth+=dir;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  renderCalHeader();renderCalGrid();
  document.getElementById('plan-sel-lbl').textContent='TAP A DATE TO SEE ITS PLAN';
  document.getElementById('plan-day-detail').innerHTML='';
}

function selectCalDay(key){
  calSelKey=key;
  renderCalGrid();
  renderPlanDayDetail(key);
}

function renderPlanDayDetail(key){
  const d=new Date(key+'T00:00:00');
  const plan=D.plan[key]||{};
  const isToday=key===todayKey();
  const dayLabel=d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('plan-sel-lbl').textContent=isToday?'TODAY\'S PLAN':'PLAN FOR SELECTED DAY';

  let slots='';
  MEAL_TYPES.forEach(type=>{
    const recipe=plan[type]?D.recipes.find(r=>r.id===plan[type].recipeId):null;
    if(recipe){
      const favMs=D.members.filter(m=>(recipe.favOf||[]).includes(m.id));
      slots+=`<div class="plan-slot">
        <div class="plan-slot-lbl">${MEAL_ICONS[type]} ${type}</div>
        <div class="plan-filled">
          <div style="flex:1;min-width:0">
            <div class="plan-filled-name">${esc(recipe.name)}</div>
            <div class="plan-filled-sub">${recipe.kcal?recipe.kcal+' kcal · ':''} ${(recipe.tags||[]).slice(0,2).join(', ')}${favMs.length?' · '+favMs.map(m=>m.emoji+m.name).join(', '):''}</div>
          </div>
          <button class="rib del" onclick="removePlan('${key}','${type}')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
      </div>`;
    } else {
      slots+=`<div class="plan-slot">
        <div class="plan-slot-lbl">${MEAL_ICONS[type]} ${type}</div>
        <div class="plan-empty" onclick="openPlanDaySheet('${key}','${type}')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Add ${type}</span>
        </div>
      </div>`;
    }
  });

  document.getElementById('plan-day-detail').innerHTML=`
    <div style="background:var(--sf);border:1px solid var(--bd);border-radius:var(--rx);padding:14px 14px 6px;margin-bottom:4px">
      <div class="plan-day-title">${dayLabel}${isToday?' 🟢':''}</div>
      <div class="plan-day-sub">Tap a meal slot to change it</div>
      ${slots}
    </div>`;
}

function removePlan(key,type){
  if(D.plan[key])delete D.plan[key][type];
  save();renderCalGrid();renderPlanDayDetail(key);if(curTab==='home')renderHome();toast('Removed');
}

// ─── PLAN SHEET ───────────────────────────────────────────────────────────
let _pd=null,_pm=null;

function openPlanDaySheet(dayKey,mealType){
  _pd=dayKey;_pm=mealType;
  openSheet('Choose Recipe',planPickHtml());
}
function openPlanSheetForRecipe(recipeId){
  _pd=null;_pm=null;
  openSheet('Add to Plan',planPickHtml(recipeId));
}

function planPickHtml(){
  const wd=weekDates();const tk=todayKey();
  const dayChips=wd.map(d=>{
    const k=dk(d);return `<div class="mchip${k===_pd?' sel':''}" data-day="${k}" onclick="document.querySelectorAll('#pp-days .mchip').forEach(e=>e.classList.remove('sel'));this.classList.add('sel');_pd=this.dataset.day;">${k===tk?'Today':DAYS[d.getDay()]+' '+d.getDate()}</div>`;
  }).join('');
  const mealChips=MEAL_TYPES.map(m=>`<div class="mchip${m===_pm?' sel':''}" data-meal="${m}" onclick="document.querySelectorAll('#pp-meals .mchip').forEach(e=>e.classList.remove('sel'));this.classList.add('sel');_pm=this.dataset.meal;">${MEAL_ICONS[m]} ${m}</div>`).join('');
  const recipeRows=D.recipes.map(r=>{
    const favMs=D.members.filter(m=>(r.favOf||[]).includes(m.id));
    return `<div class="rpick" onclick="assignPlan('${r.id}')">
      <div class="rbody">
        <div class="rpick-name">${esc(r.name)}</div>
        <div class="rpick-sub">${(r.tags||[]).slice(0,3).join(', ')}${r.kcal?' · '+r.kcal+'kcal':''}${favMs.length?' · '+favMs.map(m=>m.emoji+m.name).join(' '):''}</div>
      </div>
      <div class="rchev"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>`;
  }).join('');
  return `<label class="fl" style="margin-bottom:5px">DAY</label>
    <div class="mchip-row" id="pp-days" style="margin-bottom:12px">${dayChips}</div>
    <label class="fl" style="margin-bottom:5px">MEAL SLOT</label>
    <div class="mchip-row" id="pp-meals" style="margin-bottom:12px">${mealChips}</div>
    <label class="fl" style="margin-bottom:8px">SELECT RECIPE</label>
    <div>${recipeRows}</div>`;
}

function assignPlan(recipeId){
  if(!_pd){toast('Select a day');return;}
  if(!_pm){toast('Select a meal slot');return;}
  if(!D.plan[_pd])D.plan[_pd]={};
  D.plan[_pd][_pm]={recipeId};
  save();closeSheet();
  if(curTab==='plan'){renderCalGrid();renderPlanDayDetail(_pd);}
  if(curTab==='home')renderHome();
  toast('Added to plan ✓');
}

// ─── SETTINGS ────────────────────────────────────────────────────────────
function renderSettings(){
  const t=D.settings.theme||'dark';
  const fs=D.settings.fontSize||16;
  const memberRows=D.members.map((m,i)=>`
    <div class="prow">
      <div class="mav" style="background:${m.color}18;border:2px solid ${m.color}30;color:${m.color}">${m.emoji}</div>
      <div class="pinfo">
        <div class="ptitle">${esc(m.name)} <span style="font-size:.68rem;color:var(--t3);font-weight:400">${m.role||''}</span></div>
        <div class="psub">❤️ ${(m.favs||[]).slice(0,2).join(', ')||'No favourites yet'}</div>
      </div>
      <button class="rib" onclick="editMemberSheet(${i})" style="width:auto;padding:0 10px;font-size:.72rem;font-weight:700;color:var(--blue);background:var(--blue-bg);border-color:var(--blue-bd)">Edit</button>
    </div>`).join('<div style="height:1px;background:var(--bd2);margin:0 14px"></div>');

  document.getElementById('settings-body').innerHTML=`
    <div class="plbl">Family Members</div>
    <div class="pcard" style="margin-bottom:18px">${memberRows}</div>

    <div class="plbl">Appearance</div>
    <div class="pshdr" onclick="toggleSec('appear')">
      <div class="pshdr-l">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <span class="pshdr-title">Theme &amp; Text Size</span>
      </div>
      <span class="scaret" id="c-appear"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></span>
    </div>
    <div class="sbody" id="b-appear" style="margin-bottom:14px">
      <div class="pcard">
        <div class="prow" style="flex-direction:column;align-items:flex-start;gap:10px">
          <div style="font-size:.84rem;font-weight:600;color:var(--t1)">Theme</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%">
            <div onclick="setTheme('dark')" style="padding:10px 8px;border-radius:var(--rl);border:2px solid ${t==='dark'?'var(--green)':'var(--bd)'};background:${t==='dark'?'var(--gbg)':'var(--sf2)'};cursor:pointer;text-align:center"><div style="width:100%;height:22px;border-radius:6px;background:#0d0d10;border:1px solid #3a3a50;margin-bottom:6px"></div><div style="font-size:.72rem;font-weight:700;color:${t==='dark'?'var(--green)':'var(--t3)'}">Dark</div></div>
            <div onclick="setTheme('soft-dark')" style="padding:10px 8px;border-radius:var(--rl);border:2px solid ${t==='soft-dark'?'var(--green)':'var(--bd)'};background:${t==='soft-dark'?'var(--gbg)':'var(--sf2)'};cursor:pointer;text-align:center"><div style="width:100%;height:22px;border-radius:6px;background:#1a1a1f;border:1px solid #4c4c5c;margin-bottom:6px"></div><div style="font-size:.72rem;font-weight:700;color:${t==='soft-dark'?'var(--green)':'var(--t3)'}">Soft</div></div>
            <div onclick="setTheme('light')" style="padding:10px 8px;border-radius:var(--rl);border:2px solid ${t==='light'?'var(--green)':'var(--bd)'};background:${t==='light'?'var(--gbg)':'var(--sf2)'};cursor:pointer;text-align:center"><div style="width:100%;height:22px;border-radius:6px;background:#f2f2f7;border:1px solid #c8c8d8;margin-bottom:6px"></div><div style="font-size:.72rem;font-weight:700;color:${t==='light'?'var(--green)':'var(--t3)'}">Light</div></div>
          </div>
        </div>
        <div class="prow" style="flex-direction:column;align-items:flex-start;gap:10px;border-top:1px solid var(--bd2)">
          <div style="font-size:.84rem;font-weight:600;color:var(--t1)">Text Size</div>
          <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%">
            ${[['XS',13],['S',14],['M',16],['L',18],['XL',20]].map(([lbl,sz])=>`<button onclick="applyFontSize(${sz})" data-sz="${sz}" class="fsbtn${sz===fs?' on':''}">${lbl}</button>`).join('')}
          </div>
        </div>
      </div>
    </div>

    <div class="plbl">Data</div>
    <div class="pcard" style="margin-bottom:18px">
      <div class="prow ptap" onclick="exportData()">
        <div class="pico" style="background:var(--blue-bg);border:1px solid var(--blue-bd)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></div>
        <div class="pinfo"><div class="ptitle">Export Backup</div><div class="psub">Download recipes & plan as JSON</div></div>
        <div class="rchev"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
      </div>
      <div style="height:1px;background:var(--bd2)"></div>
      <div class="prow ptap" onclick="document.getElementById('imp').click()">
        <div class="pico" style="background:var(--abg);border:1px solid var(--abd)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
        <div class="pinfo"><div class="ptitle">Import Backup</div><div class="psub">Restore from JSON file</div></div>
        <div class="rchev"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
      </div>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(this)"/>
      <div style="height:1px;background:var(--bd2)"></div>
      <div class="prow ptap" onclick="if(confirm('Reset all data? Cannot be undone.')){localStorage.removeItem('hkv3');location.reload();}">
        <div class="pico" style="background:var(--rbg);border:1px solid var(--rbd)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></div>
        <div class="pinfo"><div class="ptitle" style="color:var(--red)">Reset All Data</div><div class="psub">Cannot be undone</div></div>
        <div class="rchev"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
      </div>
    </div>

    <div class="plbl">About</div>
    <div class="pcard" style="margin-bottom:18px">
      <div class="prow">
        <div class="pico" style="font-size:1rem">🍃</div>
        <div class="pinfo"><div class="ptitle">Healthy Kitchen</div><div class="psub">South Indian nutrition planner · v3.0</div></div>
      </div>
    </div>`;
}

function setTheme(t){applyTheme(t);renderSettings();}

function editMemberSheet(idx){
  const m=D.members[idx];
  const favChips=D.recipes.map(r=>`<div class="mchip${(m.favs||[]).includes(r.name)?' sel':''}" onclick="this.classList.toggle('sel')">${esc(r.name)}</div>`).join('');
  openSheet('Edit Member',`
    <div class="fg"><label class="fl">Name</label><input class="fi" id="em-name" value="${esc(m.name)}"/></div>
    <div class="fg"><label class="fl">Role (Dad / Mom / Son…)</label><input class="fi" id="em-role" value="${esc(m.role||'')}"/></div>
    <div class="fg"><label class="fl">Emoji</label><input class="fi" id="em-emoji" value="${esc(m.emoji||'👤')}" maxlength="2"/></div>
    <label class="fl" style="margin-bottom:5px">Favourite Dishes</label>
    <div class="mchip-row" id="em-favs" style="margin-bottom:4px">${favChips}</div>
    <div class="factions">
      <button class="btn btn-g" onclick="closeSheet()">Cancel</button>
      <button class="btn btn-p" onclick="saveMember(${idx})">Save</button>
    </div>`);
}

function saveMember(idx){
  const name=document.getElementById('em-name').value.trim();if(!name)return;
  const favs=[...document.querySelectorAll('#em-favs .mchip.sel')].map(e=>e.textContent.trim());
  D.members[idx]={...D.members[idx],name,role:document.getElementById('em-role').value.trim(),
    emoji:document.getElementById('em-emoji').value.trim()||'👤',favs};
  save();closeSheet();renderSettings();toast('Saved ✓');
}

function exportData(){
  const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='healthy-kitchen.json';a.click();toast('Exported ✓');
}
function importData(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();r.onload=e=>{try{D=JSON.parse(e.target.result);save();location.reload();}catch(x){toast('Invalid file');}};r.readAsText(f);
}

// ─── BOOT ────────────────────────────────────────────────────────────────
switchTab('home');
</script>
</body>
</html>
